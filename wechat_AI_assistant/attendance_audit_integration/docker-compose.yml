version: '3.8'

services:
  app:
    build: .
    container_name: wecom-attendance-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./preview:/app/preview
      - ./logs:/app/logs
    networks:
      - wissentek
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wissentek:
    external: true
    name: docker_wissentek
