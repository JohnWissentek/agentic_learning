# ==============================================================================
# V3.0 从零动态发现范围定义 (Commercial White-Space & AI-Native Discovery Scope)
# 本文件刻意不预设任何二级赛道、产品标题或种子机会投资参数；仅定义：
# 1. 两大宏观行业边界与价值使命；
# 2. Stage 0 广谱扫描查询词（同步覆盖产线痛点、海内外商业设备供应格局与 AI 原生仪器范式）；
# 3. 三级商业化产品空白分级体系 & AI 时代软硬件协同研发工程范式；
# 4. Stage 2 行业物理经济边界护栏（仅防量级离谱越界，不对具体仪器预设单值）。
# ==============================================================================
version: "3.0"

sector_mandates:
  power_energy:
    display_name: "电力能源全产业链制造、装备与新型电力系统"
    scope_description: >
      涵盖动力与储能电池/固态/钠电/液流制造、光伏/新型电池与绿氢制储输、特高压/智能电网/配网自动化与低碳绝缘、
      清洁高效火电调峰与CCUS，以及与新能源算力融合的新型供配电与热管理（如AI智算中心800V直流母线/液冷换热在线安全与能耗测试、
      高温超导/电力电子装备产线测试）。
  semiconductor:
    display_name: "半导体芯片制造（前道晶圆制造、功率化合物及先进封装测试）"
    scope_description: >
      涵盖晶圆厂Fab超净工艺介质(AMC/UPW/电子特气/湿化学品)、前道光刻/刻蚀/薄膜/CMP在线纳米量检测与缺陷监控、
      第三代/超宽禁带功率半导体(SiC/GaN/氧化镓)衬底外延与晶圆级动态可靠性测试、2.5D/3D Chiplet/HBM/Cu-Cu混合键合与玻璃基板量检测，
      以及硅光共封装光学(CPO)晶圆级光耦合与热-电-光协同测试等新兴制造环节。

