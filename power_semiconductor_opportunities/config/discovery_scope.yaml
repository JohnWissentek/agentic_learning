# V3.0 核心新增：商业化产品空白分级体系
commercial_whitespace_taxonomy:
  global_and_cn_commercialized:
    label: "海内外均有在售设备（存量替代/AI升维切入）"
    definition: >
      中国与海外均已有明确商业化量产整机厂商在售。新进入者不能停留在通用参数仿制，
      必须依靠 AI 计算传感软硬协同将 BOM/采购成本压低 30%-50%、或以毫秒级闭环/细分高难工段实现 TCO 升维替代。
  overseas_only_cn_blank:
    label: "海外已有成熟在售、中国商业化整机空白（卡脖子国产首发替代）"
    definition: >
      海外巨头（如 KLA、Onto、Camtek、Inficon、Bruker、Horiba、Omicron、Keysight 等）已有成熟商业型号在售，
      但中国产线量产级在线整机仍属空白或仅停留在实验室/极少数早期样机验证，存在明确断供风险与高毛利国产替代窗口。
  global_and_cn_true_blank:
    label: "海内外均无成熟在线在售产品（全球首发新物种空白）"
    definition: >
      因新一代工艺跃迁（如全固态压实界面、800VDC液冷微弧、TGV/混合键合三维亚表面、CPO热-电-光协同），
      目前海内外尚无成熟标准化产线在线在售整机，仍依赖离线破坏性抽检或人工目检，需依托 AI 计算传感实现全球首发定义。

# V3.0 核心新增：AI 时代软硬件协同产品开发四大范式
ai_native_engineering_paradigms:
  computational_sensing_and_inverse_solver:
    title: "计算传感：AI 算力换硬件物理极限"
    description: >
      以 PINNs 物理信息神经网络、神经逆散射求解器、AI 弱信号超分辨与多模态融合，在软件/算法侧补偿传感器物理信噪比与景深限制；
      从而使用成熟可获得的国产中端光电器件/探头达到海外顶尖仪器灵敏度，绕开受限高端元器件并压缩硬件 BOM 成本 30%-60%。
  synthetic_defect_and_few_shot_cold_start:
    title: "合成缺陷工厂与少样本冷启动"
    description: >
      基于物理仿真渲染器与扩散模型生成稀缺晶圆/电池/高压失效合成数据，叠加跨工段微调迁移学习，
      破解“新建产线没有足够不良品照片/波形导致传统 CV 与规则算法无法上线、标定耗时长达数月”的商业落地死结。
  ai_accelerated_multiphysics_eda_rd:
    title: "AI 驱动多物理场仿真与软硬编码周期倍速压缩"
    description: >
      利用 AI 多物理场代理模型加速光学/声学/高压热流体探头结构设计，并用 AI Agent 辅助完成 FPGA RTL 逻辑、
      高速 ADC 驱动、SECS/GEM 与 IEC 61850 工业协议栈及工艺上位机软件开发，将传统仪器 30-48 个月研发周期压缩至 10-18 个月。
  edge_ai_airgapped_closed_loop:
    title: "断网安全域 Edge-AI 边缘实时闭环与模型变现"
    description: >
      适配晶圆厂 Fab 与电网变电站断网合规要求，采用机台侧 FPGA + 工业 NPU 实现 <5-20ms 确定性推理、
      Golden-Tool 跨机台漂移自校准与 R2R/APC 联动控制，形成“标准硬件平台 + 工艺缺陷模型库订阅/升级”的高毛利持续商业模式。

