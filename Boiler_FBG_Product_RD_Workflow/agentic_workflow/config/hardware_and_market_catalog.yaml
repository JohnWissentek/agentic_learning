# 确定性工程链路参数、国际/双轨硬件选型目录与精益财务基线（用于 PALMs Python 计算引擎）

physics_link_params:
  temp_min_c: 20.0
  temp_max_c: 600.0
  temp_nominal_waterwall_c: 420.0
  thermo_optic_sensitivity_pm_per_c: 13.2     # 石英光纤高温平均灵敏度 (20~600°C 非线性二阶基准斜率)
  quadratic_coeff_pm_per_c2: 0.0042           # 高温段热膨胀+热光非线性项
  std_band_nm: 85.0                           # Ibsen I-MON 512 (1510-1595 nm)
  std_channel_spacing_nm: 3.2
  pro_band_nm: 100.0                          # Swept Laser (1500-1600 nm)
  pro_channel_spacing_nm: 2.8
  std_ase_power_dbm: 15.0                     # Amonics ALS-CL-15 (15 dBm = 31.6 mW)
  pro_swept_power_dbm: 13.0                   # Santec WSL-110 / Lumentum MG-Y (13 dBm = 20 mW)
  circulator_il_db: 1.6                       # 往返两程损耗 (0.8 dB * 2)
  mems_switch_il_db: 2.2                      # 往返两程损耗 (1.1 dB * 2)
  connector_and_splice_loss_db: 2.4           # 4对 FC/APC 法兰 + 2个熔接点双向损耗
  fiber_transmission_loss_db: 0.6             # 200m 耐高温/铠装传输缆往返损耗
  fbg_peak_reflectivity_db: -7.0              # 20% 峰值反射率 -> -7.0 dB 回波
  uwfbg_peak_reflectivity_db: -25.0           # 0.3% 弱光栅反射率 -> -25 dB 回波
  std_spectrometer_noise_floor_dbm: -42.0     # I-MON 512 典型满积分可检下限
  pro_femto_tia_noise_floor_dbm: -56.0        # FEMTO HCA-S-200M-IN + 16-bit ADC 等效有效动态下限
  mems_switch_settle_ms: 1.5
  std_exposure_per_ch_ms: 8.0
  pro_sweep_per_ch_ms: 20.0                   # 50 Hz 全谱扫频单通道周期
  thermal_block_steel_k_w_mk: 38.0            # 15CrMoG 在 420°C 下导热系数
  thermal_block_path_mm: 10.0                 # 水冷壁焊缝表面至中心测温孔壁距离

